# Astro Reveal theme: lapis enamel, brass and verdigris, like an old astrolabe.
# Colours here must match the palette at the top of astro_charts.py.

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#D4A94F"
backgroundColor = "#0F1B36"
secondaryBackgroundColor = "#17264A"
textColor = "#ECE5D2"
linkColor = "#62B8A6"
borderColor = "#56699C"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
font = "instrument, sans-serif"
headingFont = "imfell, Georgia, serif"
headingFontWeights = [400, 400, 400, 400, 400, 400]
headingFontSizes = ["2.6rem", "2rem", "1.55rem", "1.3rem", "1.1rem", "1rem"]
baseFontSize = 16
codeBackgroundColor = "#17264A"
dataframeBorderColor = "#2C3D66"
dataframeHeaderBackgroundColor = "#17264A"
dataframeHeaderTextColor = "#9AA5C0"
greenColor = "#62B8A6"
yellowColor = "#D4A94F"
blueColor = "#73A6E6"
redColor = "#E8735F"

[[theme.fontFaces]]
family = "instrument"
url = "app/static/fonts/instrument-sans.ttf"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "imfell"
url = "app/static/fonts/imfell-english.ttf"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "astroglyphs"
url = "app/static/fonts/astro-glyphs.ttf"
unicodeRange = "U+260A-260B, U+263D-2653"

[[theme.fontFaces]]
family = "astroglyphs"
url = "app/static/fonts/astro-glyphs-sun.ttf"
unicodeRange = "U+2609"
