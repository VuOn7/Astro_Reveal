# Astro Reveal theme: a light star atlas, coloured by the four elements.
# Colours here must match the palette at the top of astro_charts.py.

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#5B47E0"
backgroundColor = "#F6F4FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#221E52"
linkColor = "#5B47E0"
borderColor = "#8C86BA"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "0.9rem"
buttonRadius = "full"
baseFontSize = 18
font = "instrument, sans-serif"
headingFont = "fraunces, Georgia, serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["3rem", "2.1rem", "1.6rem", "1.3rem", "1.1rem", "1rem"]
dataframeBorderColor = "#E2DEF5"
dataframeHeaderBackgroundColor = "#F6F4FF"
greenColor = "#3FA06B"
yellowColor = "#F4B63F"
blueColor = "#3B82F6"
redColor = "#F26B4F"
violetColor = "#5B47E0"

[[theme.fontFaces]]
family = "instrument"
url = "app/static/fonts/instrument-sans.ttf"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "fraunces"
url = "app/static/fonts/fraunces.ttf"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "astroglyphs"
url = "app/static/fonts/astro-glyphs.ttf"
unicodeRange = "U+260A-260B, U+263D-2653"

[[theme.fontFaces]]
family = "astroglyphs"
url = "app/static/fonts/astro-glyphs-sun.ttf"
unicodeRange = "U+2609"
